[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @qaskly/shared build && pnpm --filter @qaskly/api prisma:generate && pnpm --filter @qaskly/api build"
watchPatterns = [
  "apps/api/**",
  "packages/shared/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.base.json"
]

[deploy]
startCommand = "pnpm --filter @qaskly/api start"
preDeployCommand = "pnpm --filter @qaskly/api prisma:migrate:deploy"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
